<style>
:root {
  --brand-purple: #8d3b91;
  --brand-gray: #4C5458;

  --text: #000000;

  --page-width: 8.5in;
  --page-height: 10.72in;
  --page-top-margin: 0.32in;
  --page-side-margin: 0.48in;
  --page-bottom-margin: 0.38in;
  --column-gap: 0.25in;
  --logo-max-width: 125px;
  --logo-max-height: 35px;
  --body-size: 8.6pt;
  --body-leading: 10.25pt;
  --body-tight-size: 8.3pt;
  --body-tight-leading: 9.6pt;
  --small-size: 7.35pt;
  --small-leading: 8.7pt;
  --top-contact-size: 8.1pt;
  --top-contact-leading: 9.2pt;
  --h1-size: 14.5pt;
  --h1-leading: 16pt;
  --eyebrow-size: 8.8pt;
  --eyebrow-leading: 10.25pt;
  --h2-size: 9.9pt;
  --h2-leading: 10.8pt;
}
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: var(--screen-bg); color: var(--text); font-family: var(--font-brand); text-align: left; }
.app { display: grid; grid-template-columns: 410px 1fr; min-height: 100vh; }
.controls { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--panel-bg); border-right: 1px solid #ccc; padding: 18px; }
.controls h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.1; }
.controls p { margin: 0 0 14px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.control-group { border-top: 1px solid #ddd; padding-top: 12px; margin-top: 12px; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
input, select, textarea { width: 100%; padding: 8px 9px; border: 1px solid #cfcfcf; border-radius: 8px; font-family: var(--font-brand); }
button { background: var(--brand-purple); color: white; border: none; border-radius: 999px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.secondary { background: white; color: var(--brand-purple); border: 2px solid var(--brand-purple); }
.service-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.check-row, .radio-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; margin: 3px 0; }
.check-row input, .radio-row input { width: auto; }
.title-preview { background: #f7f3f8; border-left: 4px solid var(--brand-purple); border-radius: 0 10px 10px 0; padding: 8px 10px; font-size: 12px; line-height: 1.3; }
.section-list { max-height: 34vh; overflow: auto; border: 1px solid #ddd; border-radius: 10px; padding: 8px; background: #fafafa; }
.section-item { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 7px 3px; border-bottom: 1px solid #e8e8e8; }
.section-item:last-child { border-bottom: 0; }
.section-item input[type="checkbox"] { width: auto; margin-top: 2px; }
.section-item-title { font-weight: 700; font-size: 12px; line-height: 1.2; }
.section-item-meta { color: var(--muted); font-size: 11px; line-height: 1.2; margin-top: 2px; }
.section-actions { display: grid; grid-template-columns: 28px 1fr 72px; gap: 6px; align-items: center; margin-top: 5px; }
.drag-handle { cursor: grab; user-select: none; color: var(--brand-purple); font-weight: 700; font-size: 15px; line-height: 1; }
.order-input { width: 64px; padding: 4px 5px; font-size: 11px; }
.section-item.dragging { opacity: .45; background: #f6eef7; }
.section-item.drag-over { border-top: 2px solid var(--brand-purple); }
.attachment-list { max-height: 18vh; overflow: auto; border: 1px solid #ddd; border-radius: 10px; padding: 8px; background: #fafafa; }
.attachment-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 3px; border-bottom: 1px solid #e8e8e8; font-size: 12px; }
.attachment-item button { padding: 4px 8px; font-size: 11px; }
.preview-wrap { padding: 20px; }
.page { width: var(--page-width); height: var(--page-height); margin: 0 auto 20px; background: var(--paper); padding: var(--page-top-margin) var(--page-side-margin) var(--page-bottom-margin); box-shadow: 0 8px 28px rgba(0,0,0,.18); position: relative; display: flex; flex-direction: column; overflow: hidden; }
.layout-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.25in; margin-bottom: 0.12in; flex: 0 0 auto; }
.logo { max-width: var(--logo-max-width); max-height: var(--logo-max-height); object-fit: contain; display: block; }
.contact-block { text-align: right; font-size: var(--top-contact-size); line-height: var(--top-contact-leading); color: var(--brand-gray); padding-top: 0.02in; white-space: nowrap; }
.contact-block strong { font-weight: 700; }
.eyebrow { font-size: var(--eyebrow-size); line-height: var(--eyebrow-leading); font-weight: 700; color: #6f6f6f; margin: 0 0 0.018in; flex: 0 0 auto; }
.h1-doc-title { font-size: var(--h1-size); line-height: var(--h1-leading); font-weight: 700; color: var(--text); margin: 0 0 0.045in; flex: 0 0 auto; letter-spacing: -0.006em; }
.document-content { flex: 1 1 auto; min-height: 0; text-align: left; overflow: hidden; }
.layout-1col { column-count: 1; column-gap: 0; }
.layout-2col { column-count: 2; column-gap: var(--column-gap); column-fill: auto; }
.legal-section { break-inside: avoid; page-break-inside: avoid; margin: 0; widows: 3; orphans: 3; }
.h2-section { break-after: avoid; page-break-after: avoid; font-size: var(--h2-size); line-height: var(--h2-leading); font-weight: 700; text-transform: uppercase; color: var(--brand-purple); margin: 0.06in 0 0.035in; orphans: 3; widows: 3; text-align: left; letter-spacing: -0.006em; }
.legal-section:first-child .h2-section:first-child { margin-top: 0; }
.p-body, .p-leadin, .p-callout { font-size: var(--body-size); line-height: var(--body-leading); font-weight: 400; margin: 0 0 0.045in; orphans: 3; widows: 3; text-align: left; letter-spacing: -0.004em; font-kerning: normal; text-rendering: optimizeLegibility; }
.p-body-tight { font-size: var(--body-tight-size); line-height: var(--body-tight-leading); font-weight: 400; margin: 0 0 0.035in; orphans: 3; widows: 3; text-align: left; letter-spacing: -0.006em; font-kerning: normal; text-rendering: optimizeLegibility; }
.p-small, .p-footer { font-size: var(--small-size); line-height: var(--small-leading); color: var(--muted); margin: 0; text-align: left; }
.char-leadin { font-weight: 700; }
.char-url, a.char-url, .char-url:visited, a.char-url:visited { color: var(--link-blue); font-weight: 500; text-decoration: underline; white-space: nowrap; overflow-wrap: normal; word-break: normal; hyphens: none; }
.char-phone, a.char-phone { color: var(--text); font-weight: 700; text-decoration: none; white-space: nowrap; overflow-wrap: normal; word-break: normal; hyphens: none; }
.char-legal-warning { font-weight: 700; text-transform: uppercase; }
.layout-footer { flex: 0 0 auto; margin-top: 0.08in; border-top: 0.5pt solid var(--brand-gray); padding-top: 0.055in; display: flex; justify-content: space-between; gap: 0.2in; width: 100%; }
.layout-footer span:last-child { text-align: right; }
.status { font-size: 12px; color: var(--muted); margin-top: 8px; }
#templateStore { display: none !important; }
#previewPages .page, .generated-page { display: flex !important; }
.pdf-attachment-frame, .pdf-attachment-object { width: 100%; height: 100%; border: 0; display: block; }
.attachment-note { font-size: 8pt; line-height: 10pt; color: var(--muted); margin: 0 0 0.05in; }
@media print {
  html, body { width: 8.5in; margin: 0 !important; padding: 0 !important; background: white !important; }
  .controls { display: none !important; }
  .app { display: block !important; margin: 0 !important; padding: 0 !important; }
  .preview-wrap, #previewPages { padding: 0 !important; margin: 0 !important; }
  #templateStore { display: none !important; }
  .page { width: 8.5in !important; height: 10.72in !important; min-height: 10.72in !important; max-height: 10.72in !important; margin: 0 !important; box-shadow: none !important; overflow: hidden !important; break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .layout-footer { margin-top: auto !important; }
  @page { size: Letter; margin: 0; }
}
</style>

<body>
  <main class="app">
    <aside class="controls">
      <h1>AN_Gen Section Bank</h1>
      <p>Stable self-contained version. Sections are embedded, so the list should not disappear.</p>
      <div class="control-group">
        <label for="csvUpload">Upload IncludedSectionContent.csv</label>
        <input id="csvUpload" type="file" accept=".csv,text/csv">
        <div class="status" id="csvStatus">Loading embedded section bank…</div>
      </div>
      <div class="control-group">
        <label for="audience">Audience</label>
        <select id="audience"><option value="residential">Residential</option><option value="business">Business</option></select>
      </div>
      <div class="control-group">
        <label>Title Presets</label>
        <label class="radio-row"><input type="radio" name="titlePreset" value="Internet" checked> Internet</label>
        <label class="radio-row"><input type="radio" name="titlePreset" value="Internet + Phone"> Internet + Phone</label>
        <label class="radio-row"><input type="radio" name="titlePreset" value="Internet + TV + Phone"> Internet + TV + Phone</label>
        <label class="radio-row"><input type="radio" name="titlePreset" value="TV + Phone + Internet"> TV + Phone + Internet</label>
        <label class="radio-row"><input type="radio" name="titlePreset" value="custom"> Custom from checked services</label>
      </div>
      <div class="control-group">
        <label>Custom Service Parts</label>
        <div class="service-grid">
          <label class="check-row"><input type="checkbox" name="servicePart" data-order="1" value="Internet" checked> Internet</label>
          <label class="check-row"><input type="checkbox" name="servicePart" data-order="2" value="TV"> TV</label>
          <label class="check-row"><input type="checkbox" name="servicePart" data-order="3" value="Phone"> Phone</label>
        </div>
      </div>
      <div class="control-group"><label for="customTitle">Custom Full Title Override</label><input id="customTitle" placeholder="Example: Residential Internet Annual Notice"></div>
      <div class="control-group"><label for="year">Document Year</label><input id="year" value="2026"></div>
      <div class="control-group"><label>Generated H1 / Document Name</label><div class="title-preview" id="titlePreview">Residential Internet 2026</div></div>
      <div class="control-group">
        <label for="columns">Columns</label>
        <select id="columns"><option value="auto" selected>Auto</option><option value="1">1 Column</option><option value="2">2 Columns</option></select>
      </div>
      <div class="control-group"><label class="check-row"><input type="checkbox" id="activeLinks" checked> Make URLs and phone numbers active links</label></div>
      <div class="control-group"><label for="sectionSearch">Search Sections</label><input id="sectionSearch" placeholder="Search name or content…"></div>
      <div class="control-group"><div class="button-row"><button id="selectAllVisible" type="button" class="secondary">Select Visible</button><button id="clearVisible" type="button" class="secondary">Clear Visible</button></div><div class="status" id="selectedCount">0 selected</div></div>
      <div class="control-group"><label>Manual Ordering</label><div class="button-row"><button id="saveOrder" type="button" class="secondary">Save Order</button><button id="resetOrder" type="button" class="secondary">Reset Order</button></div><div class="status">Drag sections or edit order numbers.</div></div>
      <div class="control-group"><label>Included Sections</label><div class="section-list" id="sectionList"></div></div>
      <div class="control-group"><label for="attachmentUpload">Append PDF Attachments</label><input id="attachmentUpload" type="file" multiple accept="application/pdf"><div class="status">Authority letters or other PDFs append after the generated notice.</div><div class="attachment-list" id="attachmentList"></div></div>
      <div class="control-group"><button onclick="window.print()">View / Download PDF</button></div>
    </aside>
    <section class="preview-wrap"><div id="previewPages"></div></section>

          <img class="logo" src="./Sparklight_R-purple-rgb.png" alt="Sparklight">

        </header>

<script>
const EMBEDDED_INCLUDED_SECTION_CONTENT_CSV = "section_name,section_content\nE911 Notice,\"As a component of your phone service, you will normally have access to the emergency 911 service at your registered address. Since E911 response can only determine your location by the address we have on record you must contact Sparklight before moving your modem to another address. Additionally, your E911 service will not operate if there is a power outage in your home and the battery backup is not charged or does not last as long as the outage or if your service is interrupted due to network or other technical problems.\"\nOverview Of Our Services,\"Economy Service TV Tier: (Basic Tier Availability) The Economy TV Tier is our lowest level of video service. Economy TV includes all available off-air broadcast stations and may include any public educational and government access channels required by local franchise. All such programming varies by community served and is subject to change at any time subject to applicable law. Pursuant to federal law cable customers must subscribe to Economy TV Tier to subscribe to any other video service. Other Services: Where available the following services are optional levels of service above and beyond the Economy TV Tier: Standard TV Tier, Digital Value Pack tier, Premium Services, Hispanic Tier, High-Speed Internet, and Phone. Channel Service Price and Other Changes: Subject to applicable law, Sparklight has the right to change at any time our channels, programming, services, and equipment, with or without notice and with or without adjustments or refunds to prices or charges. Such changes may include, but are not limited to, rearranging, deleting, adding to, or otherwise changing programming, features, offerings, content, functionality, hours of availability, customer equipment requirements, speed, and upstream and downstream rate limitations. Any notice may be provided through your monthly bill, annual notice, newspaper ad, our website, email, or other communication. Continuing to receive services after the change constitutes acceptance of the change. Channel Lineup: A complete listing of our current channel lineup including all programming options and available additional services can be reviewed at https://www. sparklight.com/channel-lineup. Your channel lineup is also available through your on-screen guide. A printed copy is also available at your local cable system office, or you may call us at the number on your bill to obtain a copy. Programming Schedules: Sparklight receives programming from various broadcast and cable networks. Sparklight is not responsible for the content or schedule aired by these networks. Please contact specific cable or broadcast networks directly with your programming complaints or questions. Notification of Programming Changes Within Our Control: Sparklight provides notice to its customers at least thirty (30) days in advance of the deletion of any programming service (if the change is within Sparklight's control) channel assignment changes or rate increases.\"\nHow To Use Your Tv Service,\"How Sparklight TV Works: How Sparklight TV Works: Sparklight TV is an IP-based TV service that provides cloud- based video programming to residential and business customers. Sparklight TV delivers advanced cable TV features in a simple and convenient app designed to run on popular streaming devices such as Sparklight TV Streaming Devices, Amazon Fire TV, Android TV and Apple TV over Sparklight's reliable fiber-based infrastructure. How to Hook Up Sparklight TV Service: There are several configurations possible to connect your consumer electronics equipment based upon your specific home equipment and your desired results. Sparklight provides detailed step-by- step instructions for each configuration on its website as well as printed brochures which are made available at no cost at each Sparklight office. Please go to the Sparklight TV Quick Start Guide at support.sparklight.com for more connection setups and troubleshooting. Parental Control Features: Sparklight TV has parental controls built-in the app. To access these, go to settings in the app. For more information about parental controls, go to the Sparklight TV Quick Start Guide at support.sparklight. com. Theft of Cable Service: Unauthorized cable hook-up service theft and or tampering with cable equipment is a federal crime that is punishable by fines or imprisonment. [See 47 U.S.C. \u00a7 553]. This includes the theft of audio, video, textual data or other services including data transmitted to or from a customer over a system that has interactive capability. Cable theft can also occur when an individual continues to receive Sparklight's cable signal subsequent to termination of service. Watch TV Everywhere: WTVE is a service that provides viewing of select networks via app through your mobile phone, tablet, or computer at any location with an internet signal.\"\nCustomer Proprietary Network Information,\"If you are a subscriber to Sparklight's phone service, we have access to data known as customer proprietary network information (\"\"CPNI\"\") which is derived from the provision of this service. CPNI includes information such as the telephone numbers called by a customer; the frequency, duration and timing of such calls; and any optional phone features purchased by the customer such as call waiting. We will not use, disclose or permit access to your CPNI, except in connection with our provision of your phone service and related services such as the publishing of directories unless required by law or with your approval. Please note that we are permitted to use your CPNI to initiate, render, bill and collect for our service; to protect against fraudulent abusive or unlawful use of our service; and to provide inbound telemarketing, referral or administrative services. Additionally, there are several laws such as the Patriot Act and the Communications Assistance for Law Enforcement Act which authorize law enforcement to override our privacy policies and through legal process demand that we provide personal subscriber information and CPNI.\"\nInternational Phone,Rates are available on our website: https://www.sparklight.com/ phone\nComplaint Resolution And Arbitration,\"Read the following paragraphs carefully because they require the parties to arbitrate their private disputes and limit the manner in which you can seek relief from Sparklight. Sparklight is committed to providing quality customer service and our policies are intended to follow the Federal Communications Commission's guidelines on customer service. Any time you have a problem with cable, internet or phone service, please call Customer Service at the applicable phone number on page one. Our representatives are available 24/7 (billing support is available during normal weekday business hours only) and will help you or arrange for a technician to address the problem. All efforts will be made by our service technicians and other associates to resolve any complaints concerning the technical quality of service promptly and efficiently. If your problem is not resolved to your satisfaction, please contact your local system manager to obtain corrective action. If your problem is not handled to your satisfaction, you may feel free to contact your regulatory authority. You may contact the FCC or local regulatory authorities. A full list of Sparklight regulatory authorities is available on www.sparklight.com. By accepting service from Sparklight you and Sparklight agree to binding arbitration of any disputes arising from such services or any aspect of your relationship with Sparklight, except that you and Sparklight are NOT required to arbitrate any dispute in which either party seeks equitable relief for the alleged unlawful use of copyrights, trademarks, trade names, logos, trade secrets or patents. ARBITRATION PREVENTS YOU FROM SUING Sparklight IN COURT OR FROM HAVING A JURY TRIAL. You and Sparklight agree that you will notify Sparklight of any dispute within 30 days of when it arises, that you and Sparklight will attempt informal resolution prior to any demand for arbitration, that any arbitration will occur in the city of your nearest Sparklight office and that arbitration will be conducted in accordance with the Rules of the American Arbitration Association (\"\"AAA\"\") by a single arbitrator selected by the parties or, if we cannot agree on an arbitrator, by the AAA. If it is necessary to file with the AAA to obtain its assistance in appointment of an arbitrator, Sparklight will pay the entire filing fee and will pay all arbitrator's fees. Whether the dispute is heard in arbitration or in court you and Sparklight will not commence against one another or seek a class action class arbitration or other consolidated representative or aggregate action or treatment, but the arbitrator has the authority to grant any other remedy that would be available in court. Visit www.Sparklight.com/ratecard to view your rates.\"\nChildren\u2019S Privacy,\"Sparklight does not knowingly collect personally identifiable information from children under thirteen years of age to connect and provide Sparklight cable or other services. If as a part of future service offerings, we decide to request personally identifiable information from children under thirteen we will require verifiable parental or guardian consent before we collect this information except in circumstances authorized by law. Sparklight encourages parents and guardians to actively participate in children's online activities and to take measures to protect the online privacy and security of their children. Sparklight supports the use of technologies that help control the collection and use of personal information from children participating in online activities.\"\nConsumer Equipment Notice,\"Sparklight TV Streaming Device: Sparklight TV Streaming Device is similar to other Android streaming devices, except the device comes preloaded with the Sparklight TV app (no need to download the app). The Sparklight TV menu has the ability to download other apps through the Google Play store. A streaming device or Sparklight TV compatible device is necessary to watch Sparklight TV programming. For a complete list of compatible devices, go to https://www.sparklight.com/ sparklighttvcompatible-devices. Remote Controls: A remote control is included with the lease of a Sparklight TV Streaming Device at no charge. If you choose to connect to Sparklight TV via your own personal streaming device or Smart TV, you will use the remote control that came with that device. Modems: Sparklight requires customers of its broadband Internet access service or services requiring access to the Sparklight broadband network to connect to its network using a model of modem that Sparklight's research has indicated is compatible with its equipment and services and that does not harm the network. Use of a non-approved modem may be subject to service interruption due to network updates or incompatibility. A DOCSIS 3.1 or higher modem is required to receive nearly all of Sparklight's speed offerings. Although DOCSIS 2.0 modems will operate on Sparklight's network at this time customers may experience substantially slower speeds than advertised. Information regarding approved modem models can be found at support.sparklight.com or by contacting Customer Service at the applicable phone number on page one. The pace of technological change is rapid and due to customer demand and other advancements modem models previously compatible may become obsolete. Sparklight may require customers to replace a non-approved or previously approved modem model with an approved one and reserves the right to discontinue provision of service to any non-approved modem. Customers may choose to lease a modem from Sparklight or purchase an approved model from a retailer. For Gig Internet Speeds: 32-channel Docsis 3.1 modem needed. Actual speeds vary and are subject to equipment limitations. Wi-Fi speeds will be substantially lower. For Cable Modem Internet Speeds of 2 Gig or Higher: Docsis 3.1 modem with ethernet port capacity exceeding 2 Gbps required. Up to 2 Gbps wired download speeds available at the cable modem. Actual speeds may vary and are not guaranteed. Multi-gig equipment, including a multi-gig router, is necessary to experience wired multi-gig speeds. Speeds available over WiFi will be limited by the capabilities of the WiFi router and environmental variables, including size of home, distance of devices from the router, device performance, and thickness of walls. For Fiber Internet Speeds of 2 Gig or Higher: Optical Network Unit (ONU) with ethernet port capacity exceeding 2 Gbps required. Up to 2 Gbps wired download speeds available at the ONU. Actual speeds may vary and are not guaranteed. Multi- gig equipment, including a multi-gig router, is necessary to experience wired multi-gig speeds. Speeds available over WiFi will be limited by the capabilities of the WiFi router and environmental variables, including size of home, distance of devices from the router, device performance, and thickness of walls. Information regarding approved modem/router models can be found by contacting Customer Service at the applicable phone number on page one. The pace of technological change is rapid and due to customer demand and other advancements, modem models previously compatible may become obsolete. Sparklight may require customers to replace a non-approved or previously approved modem model with an approved one and reserves the right to discontinue provision of service to any non-approved modem. Customers may choose to lease a modem from Sparklight or purchase an approved model from a retailer.\"\nOnline Marketing,\"Sparklight's marketing goal is to make its advertisements for its goods and services more relevant to each individual subscriber. To accomplish that Sparklight uses an array of tools designed to give us more information which will permit us to send you advertisements tailored to your interests. We collect information such as your visits to websites and the personal information you voluntarily provided to us, and we work with third party companies that help us gather non-personal information as well as facilitate the use of such information in the form of targeted advertisements. They use cookies, web beacons and other ever- changing technological tools to help us better understand all our customers and provide a positive marketing experience. Even when using third party agencies in this way we do not provide them with any of your personally identifiable information.\"\nAlternative Battery Backup,\"Telephony multimedia terminal adaptors (MTA) and FTTH rely on electrical power to operate. Without a battery backup or alternate backup source such as a generator, you will not be able to make any calls, including emergency calls to 911, in a power outage. During a power outage, many subscribers must rely on a battery backup, or an uninterruptible power supply (\"\"UPS\"\"), to ensure that their service will continue to operate. Customers who wish to use an alternative battery backup solution for an extended battery backup period can purchase UPS from many brick-and-mortar and online retailers. APC Model SMX750C, Smart UPS X, 750VA, Rack/Tower convertible 2U, 120V UPS www.apc.com/us/en/product/ SMX750C. APC Model SMX48RMBP2U, Smart-UPS X-Series 48V External Battery Pack Rack/Tower www.apc.com/us/en/product/ SMX48RMBP2U. (Both units are required for 24 hours of coverage)\"\nOpen Internet Policies And Fcc Mandated Disclosure Statement,\"The FCC requires Sparklight to provide information regarding its mass market retail broadband Internet access services, including information regarding any network management practices that it employs, the performance characteristics of its services and the commercial terms of its service offerings. A copy of Sparklight's O function setStatus(message) { const el = document.getElementById("csvStatus"); if (el) el.textContent = message; }

window.addEventListener("error", e => setStatus("Script error: " + e.message));

function canonicalHeader(value) { return String(value || "").replace(/^\uFEFF/, "").trim().toLowerCase().replace(/[\s-]+/g, "_"); }

function parseCSV(text) {
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i + 1];
    if (char === '"' && inQuotes && next === '"') { cell += '"'; i++; }
    else if (char === '"') inQuotes = !inQuotes;
    else if (char === "," && !inQuotes) { row.push(cell); cell = ""; }
    else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (char === "\r" && next === "\n") i++;
      row.push(cell);
      if (row.some(v => String(v).trim() !== "")) rows.push(row);
      row = []; cell = "";
    } else cell += char;
  }
  if (cell || row.length) {
    row.push(cell);
    if (row.some(v => String(v).trim() !== "")) rows.push(row);
  }
  if (!rows.length) return [];
  const headers = rows[0].map(canonicalHeader);
  const hasHeader = headers.some(h => ["section_name","section","name","title","content","section_content","body","text"].includes(h));
  const bodyRows = hasHeader ? rows.slice(1) : rows;
  const useHeaders = hasHeader ? headers : ["section_name","section_content","default_include","order","audience","variant_note"];
  return bodyRows.map((r, index) => {
    const obj = {};
    useHeaders.forEach((h, i) => obj[h] = (r[i] || "").trim());
    obj.__uid = `${index + 1}-${obj.section_name || obj.name || obj.title || obj.section || "section"}`;
    return normalizeSection(obj, index + 1);
  }).filter(s => s.sectionName && s.content);
}

function normalizeSection(row, index) {
  const sectionName = row.section_name || row.name || row.title || row.section || row.section_title || `Section ${index}`;
  const content = row.section_content || row.content || row.body || row.text || row.copy || "";
  const includeValue = String(row.default_include || row.include || "TRUE").toLowerCase();
  const order = Number(row.order || index);
  const audience = row.audience || "All";
  return { uid: row.__uid, order, sectionName, content, defaultInclude: includeValue !== "false" && includeValue !== "0" && includeValue !== "no", audience, variantNote: row.variant_note || row.notes || "" };
}

function escapeHtml(value) { return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

function normalizeTelHref(phoneText) { const digits = String(phoneText).replace(/\D/g, ""); return digits ? "tel:" + digits : ""; }

function autoFormatText(text) {
  let safe = escapeHtml(text).trim();
  const makeLinksActive = document.getElementById("activeLinks")?.checked ?? true;
  safe = safe.replace(/(https?:\/\/[A-Za-z0-9.-]+\.[A-Za-z]{2,})(\/)\s+([A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+)/g, "$1/$3");
  const urlRegex = /\b(?:https?:\/\/|www\.)[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:\/[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]*)?/g;
  const phoneRegex = /(?:\+?1[\s.-]?)?(?:\(\d{3}\)|\d{3})[\s.-]?\d{3}[\s.-]?\d{4}/g;
  safe = safe.replace(/([.!?])\s+(?=[A-Z][A-Za-z0-9 &/()–—-]{2,90}:)/g, "$1\n\n").replace(/;\s+(?=[A-Z][A-Za-z0-9 &/()–—-]{2,90}:)/g, ";\n\n");
  return safe.split(/\n{2,}/).map(chunk => {
    const colonIndex = chunk.indexOf(":");
    if (colonIndex > -1 && colonIndex <= 100) chunk = '<span class="char-leadin">' + chunk.slice(0, colonIndex + 1) + '</span>' + chunk.slice(colonIndex + 1);
    chunk = chunk.replace(urlRegex, m => {
      const href = m.startsWith("http://") || m.startsWith("https://") ? m : "https://" + m;
      return makeLinksActive ? `<a class="char-url" href="${href}" target="_blank" rel="noopener">${m}</a>` : `<span class="char-url">${m}</span>`;
    });
    chunk = chunk.replace(phoneRegex, m => {
      const href = normalizeTelHref(m);
      return makeLinksActive && href ? `<a class="char-phone" href="${href}">${m}</a>` : `<span class="char-phone">${m}</span>`;
    });
    chunk = chunk.replace(/(ARBITRATION PREVENTS YOU FROM SUING SPARKLIGHT IN COURT OR FROM HAVING A JURY TRIAL\.?)/g, '<span class="char-legal-warning">$1</span>');
    return `<p class="p-leadin">${chunk}</p>`;
  }).join("");
}

function loadCSVText(text, label = "CSV") {
  const parsed = parseCSV(text);
  state.sections = parsed.sort((a,b) => a.order - b.order);
  state.selected = new Set(state.sections.filter(s => s.defaultInclude).map(s => s.uid));
  setStatus(`Loaded ${state.sections.length} sections from ${label}.`);
  applyFilters();
}

async function tryRefreshFromExternalCSV() {
  try {
    const r = await fetch("IncludedSectionContent.csv?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const text = await r.text();
    if (parseCSV(text).length) loadCSVText(text, "IncludedSectionContent.csv");
  } catch(e) {}
}

function loadSavedOrder() {
  try {
    const raw = localStorage.getItem(state.orderStorageKey);
    if (!raw) return;
    state.manualOrder = new Map(Object.entries(JSON.parse(raw)).map(([k,v]) => [k, Number(v)]));
  } catch(e) { state.manualOrder = new Map(); }
}

function saveOrder() {
  const obj = {};
  state.manualOrder.forEach((v,k) => obj[k] = Number(v));
  localStorage.setItem(state.orderStorageKey, JSON.stringify(obj));
  setStatus("Manual order saved.");
}

function resetOrder() {
  state.manualOrder.clear();
  localStorage.removeItem(state.orderStorageKey);
  renderSectionControls();
  paginateDocument();
  setStatus("Manual order reset to CSV order.");
}

function getSelectedServices() {
  const preset = document.querySelector("input[name='titlePreset']:checked");
  if (preset && preset.value !== "custom") return preset.value.split("+").map(s => s.trim()).filter(Boolean);
  const checked = [...document.querySelectorAll("input[name='servicePart']:checked")].sort((a,b) => Number(a.dataset.order) - Number(b.dataset.order)).map(i => i.value);
  return checked.length ? checked : ["Internet"];
}

function buildTitle() {
  const audience = document.getElementById("audience").value;
  const year = document.getElementById("year").value || "2026";
  const custom = document.getElementById("customTitle").value.trim();
  if (custom) return `${custom} ${year}`;
  return `${config[audience].audienceLabel} ${getSelectedServices().join(" + ")} ${year}`;
}

function applyTitleAndAudience() {
  const audience = document.getElementById("audience").value;
  const c = config[audience];
  const title = buildTitle();
  document.querySelectorAll("[data-bind='phone']").forEach(el => el.textContent = c.phone);
  document.querySelectorAll("[data-bind='website']").forEach(el => el.textContent = c.website);
  document.querySelectorAll("[data-bind='doc-title']").forEach(el => el.textContent = title);
  document.querySelectorAll("[data-bind='footer-title']").forEach(el => el.textContent = `Annual Notice ${title}`);
  document.getElementById("titlePreview").textContent = title;
  applyFilters();
}

function getEffectiveOrder(section) { return state.manualOrder.has(section.uid) ? Number(state.manualOrder.get(section.uid)) : Number(section.order || 9999); }
function sortSectionsForOutput(list) { return [...list].sort((a,b) => (getEffectiveOrder(a)-getEffectiveOrder(b)) || ((a.order||0)-(b.order||0))); }

function applyFilters() {
  const audience = document.getElementById("audience").value.toLowerCase();
  const search = document.getElementById("sectionSearch").value.toLowerCase().trim();
  state.filtered = state.sections.filter(s => {
    const a = String(s.audience || "all").toLowerCase();
    const audienceMatch = a === "all" || a === "" || a.includes(audience);
    const searchMatch = !search || s.sectionName.toLowerCase().includes(search) || s.content.toLowerCase().includes(search);
    return audienceMatch && searchMatch;
  });
  renderSectionControls();
  paginateDocument();
}

function renderSectionControls() {
  const list = document.getElementById("sectionList");
  const ordered = sortSectionsForOutput(state.filtered);
  if (!ordered.length) {
    list.innerHTML = '<div class="status">No sections found. Embedded bank may not have loaded.</div>';
    return;
  }
  list.innerHTML = ordered.map(s => `
    <label class="section-item" draggable="true" data-uid="${escapeHtml(s.uid)}">
      <input type="checkbox" data-uid="${escapeHtml(s.uid)}" ${state.selected.has(s.uid) ? "checked" : ""}>
      <span>
        <span class="section-item-title">${escapeHtml(s.sectionName)}</span>
        <span class="section-item-meta">CSV Order ${s.order} · ${escapeHtml(s.audience || "All")}${s.variantNote ? " · " + escapeHtml(s.variantNote) : ""}</span>
        <span class="section-actions">
          <span class="drag-handle">☰</span>
          <span class="section-item-meta">Manual order</span>
          <input type="number" class="order-input" data-order-uid="${escapeHtml(s.uid)}" value="${getEffectiveOrder(s)}" min="1" step="1">
        </span>
      </span>
    </label>`).join("");
  list.querySelectorAll("input[type='checkbox']").forEach(input => input.addEventListener("change", e => {
    if (e.target.checked) state.selected.add(e.target.dataset.uid); else state.selected.delete(e.target.dataset.uid);
    paginateDocument();
  }));
  list.querySelectorAll(".order-input").forEach(input => input.addEventListener("change", e => {
    const v = Number(e.target.value);
    if (Number.isFinite(v)) state.manualOrder.set(e.target.dataset.orderUid, v);
    renderSectionControls();
    paginateDocument();
  }));
  setupDragOrdering(list);
}

function setupDragOrdering(list) {
  let draggedUid = null;
  list.querySelectorAll(".section-item").forEach(item => {
    item.addEventListener("dragstart", e => { draggedUid = item.dataset.uid; item.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    item.addEventListener("dragend", () => { draggedUid = null; list.querySelectorAll(".section-item").forEach(i => i.classList.remove("dragging","drag-over")); });
    item.addEventListener("dragover", e => { e.preventDefault(); if (item.dataset.uid !== draggedUid) item.classList.add("drag-over"); });
    item.addEventListener("dragleave", () => item.classList.remove("drag-over"));
    item.addEventListener("drop", e => {
      e.preventDefault();
      item.classList.remove("drag-over");
      if (!draggedUid || draggedUid === item.dataset.uid) return;
      const visible = sortSectionsForOutput(state.filtered);
      const fromIndex = visible.findIndex(s => s.uid === draggedUid);
      const toIndex = visible.findIndex(s => s.uid === item.dataset.uid);
      if (fromIndex < 0 || toIndex < 0) return;
      const moved = visible.splice(fromIndex, 1)[0];
      visible.splice(toIndex, 0, moved);
      visible.forEach((s,i) => state.manualOrder.set(s.uid, i+1));
      renderSectionControls();
      paginateDocument();
    });
  });
}

function selectedSectionsHtmlArray() {
  return sortSectionsForOutput(state.sections.filter(s => state.selected.has(s.uid))).map(s => `
    <section class="legal-section" data-section-name="${escapeHtml(s.sectionName)}">
      <h2 class="h2-section">${escapeHtml(s.sectionName)}</h2>
      ${autoFormatText(s.content)}
    </section>`);
}

function createPage(pageNumber) {
  const template = document.getElementById("pageTemplate");
  const page = template.content ? template.content.firstElementChild.cloneNode(true) : template.cloneNode(true);
  page.classList.add("generated-page");
  const c = config[document.getElementById("audience").value];
  const title = buildTitle();
  const logo = page.querySelector(".logo");
  if (logo) logo.src = c.logo;
  page.querySelectorAll("[data-bind='phone']").forEach(el => el.textContent = c.phone);
  page.querySelectorAll("[data-bind='website']").forEach(el => el.textContent = c.website);
  page.querySelectorAll("[data-bind='doc-title']").forEach(el => el.textContent = title);
  page.querySelectorAll("[data-bind='footer-title']").forEach(el => el.textContent = `Annual Notice ${title}`);
  return page;
}

function contentOverflows(contentEl) { return contentEl.scrollHeight > contentEl.clientHeight + 2 || contentEl.scrollWidth > contentEl.clientWidth + 2; }

function applyColumnsToContent(contentEl) {
  const setting = document.getElementById("columns").value;
  contentEl.classList.remove("layout-1col","layout-2col");
  if (setting === "1") contentEl.classList.add("layout-1col");
  else if (setting === "2") contentEl.classList.add("layout-2col");
  else {
    const textLength = contentEl.innerText.replace(/\s+/g," ").trim().length;
    const blockCount = contentEl.querySelectorAll("p, li, h2").length;
    if (textLength < 2600 || blockCount < 18) contentEl.classList.add("layout-1col");
    else contentEl.classList.add("layout-2col");
  }
}

function lineHeightPx(el) {
  const st = window.getComputedStyle(el);
  return parseFloat(st.lineHeight) || (parseFloat(st.fontSize) * 1.2) || 12;
}

function shouldMoveSmallSectionStub(contentEl, sectionEl) {
  if (!sectionEl || !sectionEl.classList.contains("legal-section")) return false;
  const paragraphs = sectionEl.querySelectorAll("p, li");
  if (paragraphs.length <= 1) return false;
  const contentRect = contentEl.getBoundingClientRect();
  const sectionRect = sectionEl.getBoundingClientRect();
  if (sectionRect.top < contentRect.top || sectionRect.top > contentRect.bottom) return false;
  const first = paragraphs[0];
  const minNeeded = (sectionEl.querySelector(".h2-section")?.getBoundingClientRect().height || 0) + lineHeightPx(first) * 3;
  const visible = contentRect.bottom - sectionRect.top;
  return visible > 0 && visible < minNeeded;
}

function splitOversizeSection(sectionHtml, targetPageContent, makeNewPage) {
  const temp = document.createElement("div");
  temp.innerHTML = sectionHtml;
  const section = temp.firstElementChild;
  const title = section.querySelector(".h2-section")?.outerHTML || "";
  const chunks = [...section.querySelectorAll("p, ul, ol")].map(el => el.outerHTML);
  let currentContent = targetPageContent;
  let sectionOpen = null;
  function ensureSection(openTitle) {
    if (!sectionOpen) {
      const wrap = document.createElement("section");
      wrap.className = "legal-section";
      if (openTitle) wrap.insertAdjacentHTML("beforeend", title);
      currentContent.appendChild(wrap);
      sectionOpen = wrap;
    }
    return sectionOpen;
  }
  chunks.forEach((chunk,index) => {
    const wrap = ensureSection(index === 0);
    wrap.insertAdjacentHTML("beforeend", chunk);
    if (contentOverflows(currentContent)) {
      wrap.lastElementChild.remove();
      const newPage = makeNewPage();
      currentContent = newPage.querySelector(".document-content");
      applyColumnsToContent(currentContent);
      sectionOpen = null;
      const newWrap = ensureSection(index === 0);
      newWrap.insertAdjacentHTML("beforeend", chunk);
    }
  });
  return currentContent;
}

function renderAttachmentControls() {
  const list = document.getElementById("attachmentList");
  if (!list) return;
  if (!state.attachments.length) { list.innerHTML = '<div class="status">No attachments added.</div>'; return; }
  list.innerHTML = state.attachments.map((att,index) => `
    <div class="attachment-item"><span>${index+1}. ${escapeHtml(att.name)}</span>
    <button type="button" class="secondary" data-remove-attachment="${index}">Remove</button></div>`).join("");
  list.querySelectorAll("[data-remove-attachment]").forEach(btn => btn.addEventListener("click", e => {
    const index = Number(e.target.dataset.removeAttachment);
    const att = state.attachments[index];
    if (att?.url) URL.revokeObjectURL(att.url);
    state.attachments.splice(index,1);
    renderAttachmentControls();
    paginateDocument();
  }));
}

function appendAttachmentPages(preview, pages) {
  state.attachments.forEach((att,index) => {
    const page = createPage(pages.length + 1);
    page.classList.add("attachment-page");
    const content = page.querySelector(".document-content");
    content.classList.remove("layout-1col","layout-2col");
    content.innerHTML = `<p class="attachment-note">Attachment ${index+1}: ${escapeHtml(att.name)}</p><object class="pdf-attachment-object" data="${att.url}" type="application/pdf"><iframe class="pdf-attachment-frame" src="${att.url}" title="${escapeHtml(att.name)}"></iframe></object>`;
    preview.appendChild(page);
    pages.push(page);
  });
}

function paginateDocument() {
  const preview = document.getElementById("previewPages");
  preview.innerHTML = "";
  const sections = selectedSectionsHtmlArray();
  const pages = [];
  let pageNumber = 1;
  function makeNewPage() {
    const page = createPage(pageNumber++);
    preview.appendChild(page);
    pages.push(page);
    const content = page.querySelector(".document-content");
    applyColumnsToContent(content);
    return page;
  }
  let page = makeNewPage();
  let content = page.querySelector(".document-content");
  sections.forEach(sectionHtml => {
    content.insertAdjacentHTML("beforeend", sectionHtml);
    if (!contentOverflows(content) && shouldMoveSmallSectionStub(content, content.lastElementChild)) {
      const added = content.lastElementChild;
      added.remove();
      const nextPage = makeNewPage();
      content = nextPage.querySelector(".document-content");
      content.insertAdjacentHTML("beforeend", sectionHtml);
    }
    if (contentOverflows(content)) {
      const added = content.lastElementChild;
      added.remove();
      const testPage = makeNewPage();
      const testContent = testPage.querySelector(".document-content");
      testContent.insertAdjacentHTML("beforeend", sectionHtml);
      if (contentOverflows(testContent)) {
        testContent.innerHTML = "";
        content = splitOversizeSection(sectionHtml, testContent, makeNewPage);
      } else content = testContent;
    }
  });
  appendAttachmentPages(preview, pages);
  pages.forEach((p,i) => {
    const marker = p.querySelector(".page-marker");
    if (marker) marker.textContent = `Page ${i+1} of ${pages.length}`;
  });
  document.getElementById("selectedCount").textContent = `${state.selected.size} selected · ${pages.length} page${pages.length === 1 ? "" : "s"}`;
}

function selectAllVisible(value) {
  state.filtered.forEach(s => { if (value) state.selected.add(s.uid); else state.selected.delete(s.uid); });
  renderSectionControls();
  paginateDocument();
}

function wireEvents() {
  document.getElementById("csvUpload").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadCSVText(reader.result, file.name);
    reader.readAsText(file);
  });
  document.getElementById("audience").addEventListener("change", applyTitleAndAudience);
  document.getElementById("year").addEventListener("input", applyTitleAndAudience);
  document.getElementById("columns").addEventListener("change", paginateDocument);
  document.getElementById("sectionSearch").addEventListener("input", applyFilters);
  document.getElementById("customTitle").addEventListener("input", applyTitleAndAudience);
  document.getElementById("selectAllVisible").addEventListener("click", () => selectAllVisible(true));
  document.getElementById("clearVisible").addEventListener("click", () => selectAllVisible(false));
  document.getElementById("saveOrder").addEventListener("click", saveOrder);
  document.getElementById("resetOrder").addEventListener("click", resetOrder);
  document.getElementById("activeLinks").addEventListener("change", paginateDocument);
  document.getElementById("attachmentUpload").addEventListener("change", e => {
    [...e.target.files].forEach(file => {
      if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) state.attachments.push({name:file.name, file, url:URL.createObjectURL(file)});
    });
    e.target.value = "";
    renderAttachmentControls();
    paginateDocument();
  });
  document.querySelectorAll("input[name='servicePart'], input[name='titlePreset']").forEach(input => {
    input.addEventListener("change", () => {
      if (input.name === "servicePart") document.querySelector("input[name='titlePreset'][value='custom']").checked = true;
      applyTitleAndAudience();
    });
  });
}

document.addEventListener("DOMContentLoaded", () => {
  wireEvents();
  loadSavedOrder();
  renderAttachmentControls();
  loadCSVText(EMBEDDED_INCLUDED_SECTION_CONTENT_CSV, "embedded section bank");
  tryRefreshFromExternalCSV();
});
</script>
